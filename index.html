<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibeTrade – AI-Built Intraday Trading Copilot</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome / Lucide Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkbg: '#0f172a',
            panelbg: '#1e293b',
            bordercol: '#334155',
            accentgreen: '#10b981',
            accentred: '#ef4444',
            accentyellow: '#f59e0b',
            accentblue: '#3b82f6'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Backend URL selector (default to Railway deployed backend, with fallback to localhost)
    const DEFAULT_API_URL = "https://vibetrade-backend-production.up.railway.app/api";
    const LOCAL_API_URL = "http://localhost:5000/api";

    function App() {
      const [baseUrl, setBaseUrl] = useState(DEFAULT_API_URL);
      const [backendOnline, setBackendOnline] = useState(false);
      const [candles, setCandles] = useState([]);
      const [currentStepData, setCurrentStepData] = useState(null);
      const [replayState, setReplayState] = useState({ current_index: 0, total_candles: 30, is_complete: false });
      const [auditLogs, setAuditLogs] = useState([]);
      const [viewRawJson, setViewRawJson] = useState(false);
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Check backend health & load initial candles
      useEffect(() => {
        loadData();
      }, [baseUrl]);

      const loadData = async () => {
        setLoading(true);
        setErrorMsg(null);
        try {
          // Fetch candles
          const resCandles = await fetch(`${baseUrl}/candles`);
          if (!resCandles.ok) throw new Error("Backend unavailable");
          const dataCandles = await resCandles.json();
          setCandles(dataCandles.candles || []);
          setBackendOnline(true);

          // Fetch replay state
          const resState = await fetch(`${baseUrl}/replay/state`);
          const dataState = await resState.json();
          setReplayState(dataState);

          // Get first step
          const resNext = await fetch(`${baseUrl}/replay/next`, { method: "POST" });
          const dataNext = await resNext.json();
          setCurrentStepData(dataNext);

          // Fetch logs
          const resLogs = await fetch(`${baseUrl}/audit/logs`);
          const dataLogs = await resLogs.json();
          setAuditLogs(dataLogs.logs || []);
        } catch (err) {
          console.warn("Failed to connect to primary backend URL:", baseUrl);
          setBackendOnline(false);
          // Auto fallback attempt to localhost if Railway fails
          if (baseUrl === DEFAULT_API_URL) {
            setBaseUrl(LOCAL_API_URL);
          } else {
            setErrorMsg("Could not connect to backend server. Make sure Railway or local server is running.");
          }
        } finally {
          setLoading(false);
        }
      };

      // Replay actions
      const handleNextStep = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${baseUrl}/replay/next`, { method: "POST" });
          const data = await res.json();
          setCurrentStepData(data);
          setReplayState(data.replay_state);

          const resLogs = await fetch(`${baseUrl}/audit/logs`);
          const dataLogs = await resLogs.json();
          setAuditLogs(dataLogs.logs || []);
        } catch (err) {
          setErrorMsg("Step execution failed.");
        } finally {
          setLoading(false);
        }
      };

      const handleReset = async () => {
        setLoading(true);
        try {
          await fetch(`${baseUrl}/replay/reset`, { method: "POST" });
          const resNext = await fetch(`${baseUrl}/replay/next`, { method: "POST" });
          const dataNext = await resNext.json();
          setCurrentStepData(dataNext);
          setReplayState(dataNext.replay_state);

          const resLogs = await fetch(`${baseUrl}/audit/logs`);
          const dataLogs = await resLogs.json();
          setAuditLogs(dataLogs.logs || []);
        } catch (err) {
          setErrorMsg("Reset failed.");
        } finally {
          setLoading(false);
        }
      };

      const handleJump = async (index) => {
        setLoading(true);
        try {
          await fetch(`${baseUrl}/replay/jump`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ index })
          });
          const resNext = await fetch(`${baseUrl}/replay/next`, { method: "POST" });
          const dataNext = await resNext.json();
          setCurrentStepData(dataNext);
          setReplayState(dataNext.replay_state);

          const resLogs = await fetch(`${baseUrl}/audit/logs`);
          const dataLogs = await resLogs.json();
          setAuditLogs(dataLogs.logs || []);
        } catch (err) {
          setErrorMsg(`Jump to candle ${index} failed.`);
        } finally {
          setLoading(false);
        }
      };

      // Render chart whenever current step changes
      useEffect(() => {
        if (!chartRef.current || candles.length === 0 || !currentStepData) return;

        const currentIdx = currentStepData.candle.index;
        const visibleCandles = candles.slice(0, currentIdx + 1);
        const labels = visibleCandles.map(c => `T${c.index}`);
        const prices = visibleCandles.map(c => c.close);
        const vwaps = visibleCandles.map(c => c.vwap);

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                label: 'Price ($)',
                data: prices,
                borderColor: '#10b981',
                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                borderWidth: 2,
                tension: 0.2,
                fill: true
              },
              {
                label: 'VWAP ($)',
                data: vwaps,
                borderColor: '#3b82f6',
                borderWidth: 2,
                borderDash: [5, 5],
                tension: 0.2,
                fill: false
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#94a3b8' } }
            },
            scales: {
              x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
              y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
            }
          }
        });
      }, [currentStepData, candles]);

      const candle = currentStepData?.candle;
      const signal = currentStepData?.signal;
      const risk = currentStepData?.risk;
      const trade = currentStepData?.trade;

      return (
        <div className="min-h-screen bg-[#0b0f19] text-slate-100 p-4 md:p-6 flex flex-col gap-6">
          
          {/* HEADER BAR */}
          <header className="bg-slate-800/80 border border-slate-700 rounded-xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-lg backdrop-blur">
            <div>
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xl border border-emerald-500/30">
                  <i className="fa-solid fa-chart-line"></i>
                </div>
                <div>
                  <h1 className="text-xl md:text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                    VibeTrade <span className="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded border border-blue-500/30">AI Intraday Copilot</span>
                  </h1>
                  <p className="text-xs md:text-sm text-slate-400">
                    Paper-trading demo. Deterministic Risk Gate. Synthetic data only.
                  </p>
                </div>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              {/* Server Status Indicator */}
              <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs">
                <span className={`w-2.5 h-2.5 rounded-full ${backendOnline ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`}></span>
                <span className="text-slate-300">Backend:</span>
                <span className="font-semibold text-slate-200">{backendOnline ? 'Connected' : 'Offline'}</span>
              </div>

              {/* Simulation Safety Badge */}
              <div className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5">
                <i className="fa-solid fa-shield-halved"></i>
                SIMULATION ONLY – NO LIVE ORDERS
              </div>

              {/* Server Target Toggle */}
              <button 
                onClick={() => setBaseUrl(baseUrl === DEFAULT_API_URL ? LOCAL_API_URL : DEFAULT_API_URL)}
                className="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg transition border border-slate-600"
                title="Switch API Server URL"
              >
                {baseUrl === DEFAULT_API_URL ? '🌐 Railway API' : '💻 Localhost API'}
              </button>
            </div>
          </header>

          {/* MAIN GRID */}
          <main className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* LEFT COLUMN: Market Snapshot & Replay Controls (4 cols) */}
            <section className="lg:col-span-4 flex flex-col gap-6">
              
              {/* Market Snapshot Panel */}
              <div className="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 flex flex-col gap-4 shadow-md">
                <div className="flex justify-between items-center border-b border-slate-700/60 pb-3">
                  <h2 className="font-bold text-slate-200 flex items-center gap-2">
                    <i className="fa-solid fa-gauge-high text-emerald-400"></i> Market Snapshot
                  </h2>
                  <span className="text-xs bg-slate-700 text-slate-300 font-mono px-2.5 py-1 rounded">
                    Symbol: DEMO
                  </span>
                </div>

                {/* Main Metrics Grid */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-slate-900/80 p-3 rounded-lg border border-slate-700/50">
                    <span className="text-xs text-slate-400 block">Close Price</span>
                    <span className="text-xl font-bold text-emerald-400 font-mono">
                      ${candle ? candle.close.toFixed(2) : '--'}
                    </span>
                  </div>
                  <div className="bg-slate-900/80 p-3 rounded-lg border border-slate-700/50">
                    <span className="text-xs text-slate-400 block">VWAP Indicator</span>
                    <span className="text-xl font-bold text-blue-400 font-mono">
                      ${candle ? candle.vwap.toFixed(2) : '--'}
                    </span>
                  </div>
                  <div className="bg-slate-900/80 p-3 rounded-lg border border-slate-700/50">
                    <span className="text-xs text-slate-400 block">Volume Ratio</span>
                    <span className={`text-lg font-bold font-mono ${candle?.volume_ratio > 1.8 ? 'text-amber-400' : 'text-slate-200'}`}>
                      {candle ? `${candle.volume_ratio.toFixed(2)}x` : '--'}
                    </span>
                  </div>
                  <div className="bg-slate-900/80 p-3 rounded-lg border border-slate-700/50">
                    <span className="text-xs text-slate-400 block">Rolling Volatility</span>
                    <span className={`text-lg font-bold font-mono ${candle?.volatility > 0.05 ? 'text-rose-400' : 'text-slate-200'}`}>
                      {candle ? `${(candle.volatility * 100).toFixed(2)}%` : '--'}
                    </span>
                  </div>
                </div>

                {/* Scenario Hint Note */}
                {candle?.note && (
                  <div className="bg-blue-950/40 border border-blue-800/40 text-blue-300 p-2.5 rounded-lg text-xs flex items-start gap-2">
                    <i className="fa-solid fa-circle-info mt-0.5 text-blue-400"></i>
                    <div>
                      <span className="font-semibold block">Scenario Marker:</span>
                      {candle.note}
                    </div>
                  </div>
                )}

                {/* Interactive Chart Canvas */}
                <div className="h-44 w-full bg-slate-900/90 rounded-lg p-2 border border-slate-700/60 relative">
                  <canvas ref={chartRef}></canvas>
                </div>
              </div>

              {/* Replay Controls Panel */}
              <div className="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 flex flex-col gap-4 shadow-md">
                <div className="flex justify-between items-center border-b border-slate-700/60 pb-3">
                  <h2 className="font-bold text-slate-200 flex items-center gap-2">
                    <i className="fa-solid fa-play text-blue-400"></i> Replay Controls
                  </h2>
                  <span className="text-xs font-mono text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 px-2 py-0.5 rounded">
                    Candle {replayState.current_index} / 30
                  </span>
                </div>

                <div className="flex flex-col gap-2.5">
                  <button
                    onClick={handleNextStep}
                    disabled={loading || replayState.is_complete}
                    className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white font-bold py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow"
                  >
                    <i className="fa-solid fa-forward-step"></i>
                    {loading ? 'Processing...' : 'Replay Next Event'}
                  </button>

                  <button
                    onClick={handleReset}
                    disabled={loading}
                    className="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2 rounded-lg transition flex items-center justify-center gap-2 border border-slate-600 text-sm"
                  >
                    <i className="fa-solid fa-rotate-left"></i> Reset Replay
                  </button>
                </div>

                {/* Judging Rehearsal Shortcut Buttons */}
                <div className="pt-2 border-t border-slate-700/60 flex flex-col gap-2">
                  <span className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Demo Rehearsal Shortcuts:</span>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => handleJump(11)}
                      className="bg-emerald-950/60 hover:bg-emerald-900/80 border border-emerald-700/60 text-emerald-300 text-xs p-2 rounded-lg text-left transition"
                    >
                      <div className="font-bold">Candle 11: Breakout</div>
                      <div className="text-[10px] text-emerald-400/80">Trade APPROVED</div>
                    </button>

                    <button
                      onClick={() => handleJump(21)}
                      className="bg-rose-950/60 hover:bg-rose-900/80 border border-rose-700/60 text-rose-300 text-xs p-2 rounded-lg text-left transition"
                    >
                      <div className="font-bold">Candle 21: High Vol</div>
                      <div className="text-[10px] text-rose-400/80">Trade BLOCKED</div>
                    </button>
                  </div>
                </div>
              </div>
            </section>

            {/* MIDDLE COLUMN: Signal Agent, Risk Guardian, Trade Simulator (5 cols) */}
            <section className="lg:col-span-5 flex flex-col gap-6">
              
              {/* Signal Agent Panel */}
              <div className="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 flex flex-col gap-4 shadow-md">
                <div className="flex justify-between items-center border-b border-slate-700/60 pb-3">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-robot text-purple-400 text-lg"></i>
                    <h2 className="font-bold text-slate-200">AI Signal Agent</h2>
                  </div>
                  <button
                    onClick={() => setViewRawJson(!viewRawJson)}
                    className="text-xs text-slate-400 hover:text-slate-200 underline"
                  >
                    {viewRawJson ? 'View Summary' : 'View JSON'}
                  </button>
                </div>

                {signal ? (
                  viewRawJson ? (
                    <pre className="bg-slate-900 text-emerald-400 p-3 rounded-lg text-xs font-mono overflow-x-auto border border-slate-700/60 max-h-48 custom-scroll">
                      {JSON.stringify(signal, null, 2)}
                    </pre>
                  ) : (
                    <div className="flex flex-col gap-3">
                      {/* Signal & Confidence Bar */}
                      <div className="flex items-center justify-between bg-slate-900/80 p-3 rounded-lg border border-slate-700/50">
                        <div>
                          <span className="text-xs text-slate-400 block">Proposed Action</span>
                          <span className={`text-base font-extrabold px-2.5 py-0.5 rounded border inline-block mt-0.5 ${
                            signal.signal === 'WATCH_LONG' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' :
                            signal.signal === 'EXIT_WATCH' ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' :
                            'bg-slate-700 text-slate-300 border-slate-600'
                          }`}>
                            {signal.signal}
                          </span>
                        </div>
                        <div className="text-right">
                          <span className="text-xs text-slate-400 block">Confidence Score</span>
                          <span className="text-lg font-bold font-mono text-purple-400">
                            {(signal.confidence * 100).toFixed(0)}%
                          </span>
                        </div>
                      </div>

                      {/* Reasons */}
                      <div>
                        <span className="text-xs font-semibold text-slate-400 block mb-1.5">Agent Thesis & Reasons:</span>
                        <ul className="space-y-1">
                          {signal.reasons?.map((reason, idx) => (
                            <li key={idx} className="text-xs text-slate-300 flex items-start gap-1.5 bg-slate-900/40 p-2 rounded border border-slate-800">
                              <i className="fa-solid fa-check text-emerald-400 mt-0.5 text-[10px]"></i>
                              <span>{reason}</span>
                            </li>
                          ))}
                        </ul>
                      </div>

                      {/* Risks */}
                      {signal.risks?.length > 0 && (
                        <div>
                          <span className="text-xs font-semibold text-slate-400 block mb-1.5">Risk Factors Identified:</span>
                          <ul className="space-y-1">
                            {signal.risks.map((riskItem, idx) => (
                              <li key={idx} className="text-xs text-amber-300/90 flex items-start gap-1.5 bg-amber-950/30 p-2 rounded border border-amber-900/30">
                                <i className="fa-solid fa-triangle-exclamation text-amber-400 mt-0.5 text-[10px]"></i>
                                <span>{riskItem}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      )}
                    </div>
                  )
                ) : (
                  <div className="text-xs text-slate-400 italic">No signal generated yet. Click Replay Next Event.</div>
                )}
              </div>

              {/* Risk Guardian Panel (Deterministic Gate) */}
              <div className="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 flex flex-col gap-4 shadow-md">
                <div className="flex justify-between items-center border-b border-slate-700/60 pb-3">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-shield-cat text-amber-400 text-lg"></i>
                    <h2 className="font-bold text-slate-200">Risk Guardian Gate</h2>
                  </div>
                  <span className="text-[10px] bg-slate-900 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded font-mono">
                    Deterministic Zero-LLM Rule Gate
                  </span>
                </div>

                {risk ? (
                  <div className="flex flex-col gap-3">
                    {/* Decision Banner */}
                    <div className={`p-3 rounded-lg border text-center font-bold text-sm flex items-center justify-center gap-2 ${
                      risk.approved 
                        ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-300' 
                        : 'bg-rose-950/60 border-rose-500/50 text-rose-300'
                    }`}>
                      <i className={`fa-solid ${risk.approved ? 'fa-circle-check text-emerald-400' : 'fa-ban text-rose-400'}`}></i>
                      {risk.approved ? 'RISK CHECK PASSED – TRADE APPROVED' : 'TRADE REJECTED BY RISK GUARDIAN'}
                    </div>

                    {/* Check Indicators Grid */}
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                      {Object.entries(risk.checks || {}).map(([key, result]) => (
                        <div key={key} className={`p-2 rounded border text-xs flex justify-between items-center ${
                          result === 'passed' ? 'bg-slate-900/60 border-emerald-900/50 text-slate-300' : 'bg-rose-950/40 border-rose-800/60 text-rose-300'
                        }`}>
                          <span className="capitalize">{key.replace('_', ' ')}</span>
                          <span className={`font-mono text-[10px] px-1.5 py-0.5 rounded ${
                            result === 'passed' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'
                          }`}>
                            {result}
                          </span>
                        </div>
                      ))}
                    </div>

                    {/* Rejection Reason Box */}
                    {risk.rejection_reason && (
                      <div className="bg-rose-950/50 border border-rose-800/60 text-rose-300 p-2.5 rounded-lg text-xs flex items-start gap-2">
                        <i className="fa-solid fa-circle-xmark text-rose-400 mt-0.5"></i>
                        <div>
                          <span className="font-bold block">Rejection Cause:</span>
                          {risk.rejection_reason}
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="text-xs text-slate-400 italic">Awaiting risk evaluation...</div>
                )}
              </div>

              {/* Trade Simulator Panel */}
              <div className="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 flex flex-col gap-4 shadow-md">
                <div className="flex justify-between items-center border-b border-slate-700/60 pb-3">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-[#10b981] fa-laptop-code text-emerald-400 text-lg"></i>
                    <h2 className="font-bold text-slate-200">Paper Trade Simulator</h2>
                  </div>
                  <span className="text-[10px] text-slate-400">0.1% Slippage + $1 Fee</span>
                </div>

                {trade ? (
                  <div className="flex flex-col gap-3">
                    <div className="grid grid-cols-2 gap-3 text-xs">
                      <div className="bg-slate-900/80 p-2.5 rounded border border-slate-700/50">
                        <span className="text-slate-400 block">Entry Price (w/ Slippage)</span>
                        <span className="font-bold text-slate-200 font-mono">${trade.entry_price.toFixed(2)}</span>
                      </div>
                      <div className="bg-slate-900/80 p-2.5 rounded border border-slate-700/50">
                        <span className="text-slate-400 block">Quantity</span>
                        <span className="font-bold text-slate-200 font-mono">{trade.quantity} shares</span>
                      </div>
                      <div className="bg-slate-900/80 p-2.5 rounded border border-slate-700/50">
                        <span className="text-slate-400 block">Exit Price (3 Candles)</span>
                        <span className="font-bold text-slate-200 font-mono">${trade.exit_price ? trade.exit_price.toFixed(2) : '--'}</span>
                      </div>
                      <div className="bg-slate-900/80 p-2.5 rounded border border-slate-700/50">
                        <span className="text-slate-400 block">Simulated Net P&L</span>
                        <span className={`font-bold font-mono text-sm ${trade.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                          {trade.pnl >= 0 ? `+$${trade.pnl.toFixed(2)}` : `-$${Math.abs(trade.pnl).toFixed(2)}`}
                        </span>
                      </div>
                    </div>

                    <div className="flex items-center justify-between bg-slate-900 p-2.5 rounded border border-slate-700/60 text-xs">
                      <span className="text-slate-400">Execution Status:</span>
                      <span className={`font-bold px-2 py-0.5 rounded ${
                        trade.status === 'APPROVED (PAPER)' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'
                      }`}>
                        {trade.status}
                      </span>
                    </div>
                  </div>
                ) : (
                  <div className="text-xs text-slate-400 italic">No trade simulated.</div>
                )}
              </div>

            </section>

            {/* RIGHT COLUMN: Audit Timeline & Transparency (3 cols) */}
            <section className="lg:col-span-3 flex flex-col gap-6">
              
              {/* Audit Timeline Panel */}
              <div className="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 flex flex-col gap-4 shadow-md h-[460px]">
                <div className="flex justify-between items-center border-b border-slate-700/60 pb-3">
                  <h2 className="font-bold text-slate-200 flex items-center gap-2">
                    <i className="fa-solid fa-clock-rotate-left text-blue-400"></i> Audit Timeline
                  </h2>
                  <span className="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono">
                    {auditLogs.length} Events
                  </span>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 custom-scroll pr-1">
                  {auditLogs.length === 0 ? (
                    <div className="text-xs text-slate-400 italic">No events logged yet.</div>
                  ) : (
                    auditLogs.map((evt) => (
                      <div key={evt.id} className="bg-slate-900/80 border border-slate-700/60 rounded-lg p-3 text-xs flex flex-col gap-1.5">
                        <div className="flex justify-between items-center text-[10px] text-slate-400 border-b border-slate-800 pb-1">
                          <span>Candle #{evt.candle_index}</span>
                          <span className={`font-bold ${
                            evt.outcome === 'TRADE_EXECUTED' ? 'text-emerald-400' :
                            evt.outcome === 'TRADE_REJECTED' ? 'text-rose-400' : 'text-slate-400'
                          }`}>
                            {evt.outcome}
                          </span>
                        </div>
                        <div className="flex justify-between text-slate-300">
                          <span>Close Price:</span>
                          <span className="font-mono font-semibold">${evt.price.toFixed(2)}</span>
                        </div>
                        <div className="flex justify-between text-slate-300">
                          <span>Signal:</span>
                          <span className="font-semibold">{evt.signal?.signal}</span>
                        </div>
                        <div className="flex justify-between text-slate-300">
                          <span>Risk Gate:</span>
                          <span className={`font-semibold ${evt.risk_decision?.approved ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {evt.risk_decision?.approved ? 'Approved' : 'Rejected'}
                          </span>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>

              {/* Build Transparency Panel */}
              <div className="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 flex flex-col gap-3 shadow-md">
                <h3 className="font-bold text-xs uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                  <i className="fa-solid fa-code text-emerald-400"></i> Architecture Principles
                </h3>
                <ul className="text-xs text-slate-300 space-y-2">
                  <li className="flex items-start gap-2">
                    <i className="fa-solid fa-check-double text-emerald-400 mt-0.5"></i>
                    <span>Structured JSON AI Signal Proposals</span>
                  </li>
                  <li className="flex items-start gap-2">
                    <i className="fa-solid fa-shield-halved text-amber-400 mt-0.5"></i>
                    <span>Deterministic Zero-LLM Risk Guardian</span>
                  </li>
                  <li className="flex items-start gap-2">
                    <i className="fa-solid fa-ban-smoke text-blue-400 mt-0.5"></i>
                    <span>Paper-Trading & Synthetic Data Only</span>
                  </li>
                  <li className="flex items-start gap-2">
                    <i className="fa-solid fa-user-check text-purple-400 mt-0.5"></i>
                    <span>Human-in-the-Loop Final Approval</span>
                  </li>
                </ul>
              </div>

            </section>

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
